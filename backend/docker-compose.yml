version: '3.8'
services:
  postgres:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: parkflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgres://postgres:password@postgres:5432/parkflow
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=change_this_secret
      - STRIPE_SECRET=
      - STRIPE_WEBHOOK_SECRET=
      - PORT=5000
    ports:
      - '5000:5000'
    volumes:
      - ./:/app
    command: npm run dev

volumes:
  pgdata:
